name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags to find the release version of this commit.
          fetch-depth: 0
      # Builds of a commit that carries a stable vX.Y.Z tag are releases and show the version, others the commit.
      - name: Read build info
        id: build
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          release=false
          if [ -n "$tag" ] && git tag --points-at HEAD | grep -qx "$tag"; then release=true; fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version: ${tag:-none}, release build: $release"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wolups
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WOLUPS_VERSION=${{ steps.build.outputs.version }}
            WOLUPS_COMMIT=${{ github.sha }}
            WOLUPS_RELEASE=${{ steps.build.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
