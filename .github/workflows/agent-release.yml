name: Agent release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Check version tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must look like vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build agents
        working-directory: agent
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o ../dist/wolups-agent-linux-$arch .
          done
          ../dist/wolups-agent-linux-amd64 version
      - name: Package release files
        working-directory: dist
        run: |
          cp ../agent/install.sh ../agent/uninstall.sh .
          printf '{"version":"%s","protocol_version":1}\n' "$VERSION" > agent-release.json
          for f in wolups-agent-linux-amd64 wolups-agent-linux-arm64 agent-release.json install.sh uninstall.sh; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
